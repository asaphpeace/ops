services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────
  # IMPORTANT: --workers 1 is mandatory — APScheduler runs in-process.
  # Adding workers will cause every scheduled task to fire N times.
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload
    volumes:
      - ./backend:/app
      # db_backup (app/scheduler.py) runs pg_dump from here — replaces the old
      # docker-entrypoint-initdb.d approach, confirmed to only ever run once
      - ./backups:/backups
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Vue 3 + Vite frontend ─────────────────────────────────
  web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  # ── nginx reverse proxy ───────────────────────────────────
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - web

volumes:
  postgres-data:
