worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api {
    server api:8000;
  }

  upstream web {
    server web:5173;
  }

  server {
    listen 80;

    # API
    # proxy_buffering off + proxy_http_version 1.1 are required for the
    # Ollama chat SSE endpoint (POST /api/ollama-chat/conversations/{id}/messages)
    # — without them nginx buffers the whole response and flushes it to the
    # browser all at once, silently defeating token-by-token streaming.
    # Applies to the whole /api/ prefix; harmless for every other
    # non-streaming JSON endpoint.
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite HMR websocket (dev only)
    location /ws {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Frontend — all other routes
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
